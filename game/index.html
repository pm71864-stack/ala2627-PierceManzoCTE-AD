<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Vault Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="vault-shell">
    <header class="topbar">
      <a class="back-link" href="../">← Main site</a>
      <div class="vault-mark"><span>THE</span> VAULT <b>ARCADE / 06</b></div>
      <span class="status"><i></i> LIVE</span>
    </header>

    <section class="intro">
      <p class="kicker">The Game Vault</p>
      <h1>Six games<br><em>to play.</em></h1>
      <p class="intro-copy"><span class="copy-index">[ PLAYLIST_06 ]</span> The perfect 6 games for you, made by me.</p>
    </section>

    <nav class="game-select" aria-label="Choose a game">
      <button class="game-choice active" data-game="dash"><span class="choice-number">01</span><strong>Neon
          Dash</strong><small>Jump the beat</small></button>
      <button class="game-choice" data-game="shooter"><span
          class="choice-number">02</span><strong>Starfall</strong><small>Clear the sky</small></button>
      <button class="game-choice" data-game="pong"><span class="choice-number">03</span><strong>Pixel
          Pong</strong><small>Own the rally</small></button>
      <button class="game-choice" data-game="hoops"><span class="choice-number">04</span><strong>Street
          Hoops</strong><small>Find your rhythm</small></button>
      <button class="game-choice" data-game="blackjack"><span class="choice-number">05</span><strong>Blackjack
          21</strong><small>Beat the dealer</small></button>
      <button class="game-choice" data-game="reflex"><span class="choice-number">06</span><strong>Reflex
          Grid</strong><small>Test your timing</small></button>
    </nav>

    <section class="arcade" aria-labelledby="game-title">
      <div class="arcade-head">
        <div>
          <p class="game-label" id="game-label">01 / NEON DASH</p>
          <h2 id="game-title">Neon Dash</h2>
        </div>
        <div class="score-box"><span id="score-label">SCORE</span><strong id="score">0000</strong></div>
      </div>
      <div class="difficulty-panel" id="difficulty-panel" hidden>
        <span>DIFFICULTY</span>
        <button class="difficulty-choice" data-difficulty="easy">Easy</button>
        <button class="difficulty-choice active" data-difficulty="medium">Medium</button>
        <button class="difficulty-choice" data-difficulty="hard">Hard</button>
      </div>
      <div class="canvas-wrap"><canvas id="game-canvas" width="900" height="500" aria-label="Game screen"></canvas>
        <div class="start-card" id="start-card"><span class="start-icon">✦</span>
          <h3 id="start-title">Ready to run?</h3>
          <p id="start-copy">Press the button or hit Space to jump.</p><button id="start-button">Start game</button>
        </div>
      </div>
      <div class="controls"><span id="controls-copy">SPACE / CLICK — JUMP</span><button class="restart"
          id="restart-button">↻ Restart</button></div>
      <div class="touch-controls" aria-label="Touch controls"><button data-action="left">←</button><button
          data-action="action">●</button><button data-action="right">→</button></div>
    </section>
    <footer><span>THE VAULT / 2026</span><span>Built for replay value</span></footer>
  </main>
  <script src="arcade.js"></script>
</body>

</html>
