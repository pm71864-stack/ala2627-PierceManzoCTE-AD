 <!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CHANGE THIS. It is the name on the browser tab, and it is what Google shows. -->
  <title>Pierces Space runners game </title>

  <!-- CHANGE THIS TOO. One sentence. It is what shows under your link when someone shares it. -->
  <meta name="description" content="My personal website for testing code.">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="game-shell">
    <section class="game-header" aria-labelledby="game-title">
      <div>
        <p class="eyebrow">Last Period // SECTOR 07</p>
        <h1 id="game-title">Pierce Manzo</h1>
        <p class="tagline">I Coded This Site.</p>
      </div>
      <div class="scoreboard" aria-label="Game stats">
        <div><span>Score</span><strong id="score">0000</strong></div>
        <div><span>Lives</span><strong id="lives">03</strong></div>
      </div>
    </section>

    <section class="game-stage" aria-label="Signal Drift game">
      <canvas id="game-canvas" width="800" height="520"></canvas>
      <div class="game-message" id="game-message">
        <p class="message-kicker">INCOMING SIGNAL</p>
        <h2>Thread the gap.</h2>
        <p>Move the ship. Dodge the Red orbs. Collect the Green pulses.</p>
        <button id="start-button" type="button">Launch signal</button>
      </div>
    </section>

    <section class="controls" aria-label="Game controls">
      <p><span class="key">A</span><span class="key">D</span> or <span class="key">←</span><span class="key">→</span> steer</p>
      <button class="icon-button" id="pause-button" type="button" title="Pause game" aria-label="Pause game">Ⅱ</button>
      <p><span class="key">P</span> pause <span class="dot">•</span> <span class="key">R</span> restart</p>
    </section>
  </main>

  <script src="game.js"></script>


</body>

</html>
